<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Memories</title>
    <style>
      /* ─── Reset & Root ─────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --sky0: #8dbdd4;
        --sky1: #a8cedf;
        --sky2: #bcd9e8;
        --sky3: #cce2ef;
        --chip: rgba(255, 255, 255, 0.64);
        --chip2: rgba(210, 228, 238, 0.82);
        --card-r: 20px;
        --detail-bg: #f0ede8;
        --text: #18181c;
        --muted: rgba(0, 0, 0, 0.4);
        --red: #e5473d;
        --shadow: 0 4px 22px rgba(0, 0, 0, 0.18);
        --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.13);
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(
            ellipse at 75% 5%,
            rgba(255, 255, 255, 0.38) 0%,
            transparent 38%
          ),
          radial-gradient(
            ellipse at 15% 55%,
            rgba(255, 255, 255, 0.22) 0%,
            transparent 32%
          ),
          radial-gradient(
            ellipse at 85% 80%,
            rgba(255, 255, 255, 0.18) 0%,
            transparent 28%
          ),
          linear-gradient(
            160deg,
            var(--sky0) 0%,
            var(--sky1) 35%,
            var(--sky2) 65%,
            var(--sky3) 100%
          );
        user-select: none;
        -webkit-user-select: none;
      }

      /* ─────────────────────────────── GALLERY VIEW ─── */
      #galleryView {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        transition:
          opacity 0.38s ease,
          transform 0.38s ease;
        z-index: 1;
      }
      #galleryView.bg {
        opacity: 0;
        transform: scale(0.96);
        pointer-events: none;
      }

      /* Top bar */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 52px 22px 10px;
        position: relative;
        z-index: 2;
        flex-shrink: 0;
      }
      .profile-row {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.75);
        box-shadow: var(--shadow-sm);
        flex-shrink: 0;
        background: #ccc;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .chip {
        background: var(--chip);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        border-radius: 24px;
        padding: 5px 13px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text);
        letter-spacing: -0.015em;
      }

      .icon-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--chip);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
        transition: transform 0.18s ease;
        flex-shrink: 0;
      }
      .icon-circle:active {
        transform: scale(0.86);
      }

      /* Gallery scroll */
      #galleryScroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px 0 120px;
        -webkit-overflow-scrolling: touch;
        transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        transform-origin: top center;
      }
      #galleryScroll::-webkit-scrollbar {
        display: none;
      }
      #galleryScroll.z-out {
        transform: scale(0.7);
      }
      #galleryScroll.z-in {
        transform: scale(1.32);
      }

      /* Collection row */
      .c-row {
        display: flex;
        flex-direction: column;
        margin: 14px 0;
        padding: 0 26px;
        gap: 0;
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
        opacity: 0;
        animation: rowIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .c-row.left {
        align-items: flex-start;
      }
      .c-row.right {
        align-items: flex-end;
      }
      .c-row:nth-child(1) {
        animation-delay: 0.08s;
      }
      .c-row:nth-child(2) {
        animation-delay: 0.18s;
      }
      .c-row:nth-child(3) {
        animation-delay: 0.26s;
      }
      .c-row:nth-child(4) {
        animation-delay: 0.34s;
      }
      .c-row:nth-child(5) {
        animation-delay: 0.4s;
      }
      .c-row.dim {
        opacity: 0.18;
        transform: scale(0.94);
      }

      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .c-label {
        background: var(--chip);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        border-radius: 22px;
        padding: 5px 14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
      }

      .c-count {
        font-size: 11px;
        color: var(--muted);
        margin-top: 7px;
        letter-spacing: -0.01em;
      }

      /* ─── Card Cluster ─── */
      .cluster {
        position: relative;
        width: 214px;
        height: 196px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.2s ease;
      }
      .cluster:active {
        transform: scale(0.93) !important;
      }

      /* Hover — fan cards apart */
      .cluster:hover .c-card.k1 {
        transform: rotate(-14deg) translate(-9px, 7px);
      }
      .cluster:hover .c-card.k2 {
        transform: rotate(-5deg) translate(-4px, 1px);
      }
      .cluster:hover .c-card.k3 {
        transform: rotate(7deg) translate(5px, -3px);
      }

      .c-card {
        position: absolute;
        border-radius: var(--card-r);
        overflow: hidden;
        box-shadow: var(--shadow);
        transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        background: rgba(180, 200, 210, 0.6);
      }
      .c-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }

      /* card layout inside cluster */
      .c-card.k1 {
        width: 108px;
        height: 116px;
        top: 28px;
        left: 2px;
        transform: rotate(-11deg);
        z-index: 1;
      }
      .c-card.k2 {
        width: 116px;
        height: 122px;
        top: 12px;
        left: 28px;
        transform: rotate(-3.5deg);
        z-index: 2;
      }
      .c-card.k3 {
        width: 142px;
        height: 158px;
        top: 0;
        left: 58px;
        transform: rotate(5deg);
        z-index: 3;
      }

      /* ─── Search / Bottom Bar ─── */
      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 10px 16px 30px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(
          to top,
          rgba(120, 172, 200, 0.7) 0%,
          transparent 100%
        );
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        z-index: 20;
      }
      .search-wrap {
        flex: 1;
        background: var(--chip2);
        backdrop-filter: blur(20px) saturate(1.6);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        border-radius: 30px;
        padding: 11px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      }
      .search-wrap svg {
        color: rgba(0, 0, 0, 0.38);
        flex-shrink: 0;
      }
      .search-wrap input {
        border: none;
        background: transparent;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        outline: none;
        width: 100%;
        letter-spacing: -0.01em;
      }
      .search-wrap input::placeholder {
        color: rgba(0, 0, 0, 0.36);
      }

      .bar-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--chip2);
        backdrop-filter: blur(20px) saturate(1.6);
        -webkit-backdrop-filter: blur(20px) saturate(1.6);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.09);
        color: #2a2a30;
        flex-shrink: 0;
        transition:
          transform 0.15s ease,
          background 0.15s;
      }
      .bar-btn:active {
        transform: scale(0.88);
        background: rgba(180, 208, 222, 0.9);
      }

      /* ─────────────────────────── DETAIL VIEW ─── */
      #detailView {
        position: fixed;
        inset: 0;
        background: var(--detail-bg);
        z-index: 50;
        display: flex;
        flex-direction: column;
        transform: translateY(102%);
        transition: transform 0.56s cubic-bezier(0.32, 0.72, 0, 1);
        border-radius: 28px 28px 0 0;
        overflow: hidden;
        will-change: transform;
      }
      #detailView.open {
        transform: translateY(0);
        transition: transform 0.52s cubic-bezier(0.32, 0.72, 0, 1);
      }
      /* small pill handle at top of sheet */
      .handle {
        width: 38px;
        height: 5px;
        background: rgba(0, 0, 0, 0.16);
        border-radius: 3px;
        margin: 10px auto 0;
        flex-shrink: 0;
      }

      .detail-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 22px 10px;
        position: relative;
        flex-shrink: 0;
      }
      .back-btn {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.07);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2a2a2a;
        transition:
          background 0.14s,
          transform 0.14s;
      }
      .back-btn:active {
        background: rgba(0, 0, 0, 0.13);
        transform: translateY(-50%) scale(0.88);
      }

      .detail-title {
        font-size: 17px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.03em;
      }
      .detail-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
        letter-spacing: -0.01em;
      }

      /* ─── Carousel ─── */
      .carousel-outer {
        flex: 1;
        overflow: hidden;
        display: flex;
        align-items: center;
        cursor: grab;
        min-height: 0;
        position: relative;
      }
      .carousel-outer:active {
        cursor: grabbing;
      }

      #carouselTrack {
        display: flex;
        align-items: center;
        gap: 14px;
        transition: transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }

      .photo-card {
        flex-shrink: 0;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 8px 36px rgba(0, 0, 0, 0.14);
        transition:
          transform 0.44s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.44s ease,
          box-shadow 0.44s ease;
        background: #bbb;
      }
      .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        draggable: false;
      }
      .photo-card.side {
        transform: scale(0.86);
        opacity: 0.52;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      /* ─── Scrubber ─── */
      .scrubber-wrap {
        padding: 6px 26px 0;
        flex-shrink: 0;
      }
      .scrubber-inner {
        height: 22px;
        display: flex;
        align-items: center;
        gap: 2.5px;
        cursor: pointer;
      }
      .s-tick {
        flex: 1;
        height: 6.5px;
        background: rgba(0, 0, 0, 0.13);
        border-radius: 2px;
        transition:
          height 0.2s ease,
          background 0.2s ease;
      }
      .s-tick.on {
        height: 14px;
        background: rgba(0, 0, 0, 0.46);
      }

      /* Location */
      .loc-row {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        padding: 8px 0 10px;
        flex-shrink: 0;
        letter-spacing: -0.01em;
      }

      /* Actions */
      .actions {
        display: flex;
        justify-content: center;
        gap: 18px;
        padding: 0 20px 40px;
        flex-shrink: 0;
      }
      .act-btn {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.065);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2a2a30;
        transition:
          background 0.15s,
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .act-btn:active {
        background: rgba(0, 0, 0, 0.12);
        transform: scale(0.88);
      }
      .act-btn.liked svg {
        fill: var(--red);
        stroke: var(--red);
      }

      /* ─── Zoom cursor flash ─── */
      .bar-btn.flashed {
        animation: btnFlash 0.3s ease;
      }
      @keyframes btnFlash {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.82);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <!-- ═══════════════════════════ GALLERY VIEW ════════════════════════════ -->

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="search-wrap">
          <svg
            width="15"

            fill="none"
            stroke="currentColor"

            <circle cx="11" cy="11" r="8" />

        <button class="bar-btn" id="zoomInBtn" title="Zoom in">

            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"

      <div class="detail-header">

          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <div class="detail-title" id="dTitle">Mountain hike</div>
        <div class="detail-sub" id="dCount">39 photos</div>
      </div>

      <div class="carousel-outer" id="carouselOuter">
        <div id="carouselTrack"></div>
      </div>

      <div class="scrubber-wrap">
        <div class="scrubber-inner" id="scrubberInner"></div>
      </div>

      <div class="loc-row" id="dLoc">Vorokhta, Ukraine</div>

      <div class="actions">
        <button class="act-btn" id="likeBtn">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            />
          </svg>
        </button>
        <button class="act-btn">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="4" y1="21" x2="4" y2="14" />
            <line x1="4" y1="10" x2="4" y2="3" />
            <line x1="12" y1="21" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12" y2="3" />
            <line x1="20" y1="21" x2="20" y2="16" />
            <line x1="20" y1="12" x2="20" y2="3" />
            <line x1="1" y1="14" x2="7" y2="14" />
            <line x1="9" y1="8" x2="15" y2="8" />
            <line x1="17" y1="16" x2="23" y2="16" />
          </svg>
        </button>
        <button class="act-btn">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v6M14 11v6M9 6V4h6v2" />
          </svg>
        </button>
      </div>
    </div>
    <!-- /detailView -->

    <!-- ═══════════════════════════ SCRIPT ══════════════════════════════════ -->
    <script>
      /* ─── Collection data ─────────────────────────────────────── */
      const COLS = {
        lviv: {
          title: "Lviv",
          count: 24,
          location: "Lviv, Ukraine",
          liked: false,
          photos: [
            "https://images.unsplash.com/photo-1580535086045-7c82e0c0e0e4?w=720&q=88",
            "https://images.unsplash.com/photo-1467224298296-81a33a3f3022?w=720&q=88",
            "https://images.unsplash.com/photo-1561631963-b8c66e7ed940?w=720&q=88",
            "https://images.unsplash.com/photo-1593106410288-caf65eca7c9d?w=720&q=88",
            "https://images.unsplash.com/photo-1600021378210-a2acf7b6cedb?w=720&q=88",
          ],
        },
        portugal: {
          title: "Portugal trip",
          count: 117,
          location: "Algarve, Portugal",
          liked: true,
          photos: [
            "https://images.unsplash.com/photo-1555881400-74d7acaacd8b?w=720&q=88",
            "https://images.unsplash.com/photo-1513735492246-483525079686?w=720&q=88",
            "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=720&q=88",
            "https://images.unsplash.com/photo-1548690312-e3b507d8c110?w=720&q=88",
            "https://images.unsplash.com/photo-1548063168-f36f3c96ac82?w=720&q=88",
          ],
        },
        mountain: {
          title: "Mountain hike",
          count: 39,
          location: "Vorokhta, Ukraine",
          liked: false,
          photos: [
            "https://images.unsplash.com/photo-1452626038306-9aae5e071dd3?w=720&q=88",
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=720&q=88",
            "https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?w=720&q=88",
            "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=720&q=88",
            "https://images.unsplash.com/photo-1551632811-561732d1e306?w=720&q=88",
          ],
        },
        city: {
          title: "City nights",
          count: 52,
          location: "Various cities",
          liked: false,
          photos: [
            "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=720&q=88",
            "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=720&q=88",
            "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=720&q=88",
            "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=720&q=88",
            "https://images.unsplash.com/photo-1514565131-fce0801e6785?w=720&q=88",
          ],
        },
        coast: {
          title: "Coast summer",
          count: 61,
          location: "Mediterranean",
          liked: false,
          photos: [
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=720&q=88",
            "https://images.unsplash.com/photo-1548690312-e3b507d8c110?w=720&q=88",
            "https://images.unsplash.com/photo-1499678329028-101435549a4e?w=720&q=88",
            "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=720&q=88",
            "https://images.unsplash.com/photo-1502680390469-be75c86b636f?w=720&q=88",
          ],
        },
      };

      /* ─── State ───────────────────────────────────────────────── */
      let key = null,
        idx = 0,
        zoom = 0;
      let drag = { on: false, x0: 0, xc: 0 };
      let pinch0 = 0;

      /* ─── Elements ───────────────────────────────────────────── */
      const gView = document.getElementById("galleryView");
      const dView = document.getElementById("detailView");
      const gScroll = document.getElementById("galleryScroll");
      const cTrack = document.getElementById("carouselTrack");
      const cOuter = document.getElementById("carouselOuter");
      const scrubEl = document.getElementById("scrubberInner");
      const srchEl = document.getElementById("searchInput");
      const likeBtn = document.getElementById("likeBtn");

      /* ─── Open collection ─────────────────────────────────────── */
      function openCol(k) {
        key = k;
        idx = 0;
        const d = COLS[k];
        document.getElementById("dTitle").textContent = d.title;
        document.getElementById("dCount").textContent = d.count + " photos";
        document.getElementById("dLoc").textContent = d.location;
        likeBtn.classList.toggle("liked", d.liked);

        buildCarousel(d.photos);
        buildScrubber(d.photos.length);

        dView.classList.add("open");
        gView.classList.add("bg");
        setTimeout(positionCarousel, 60);
      }

      function closeCol() {
        dView.classList.remove("open");
        gView.classList.remove("bg");
        key = null;
      }

      document.getElementById("backBtn").addEventListener("click", closeCol);

      /* Cluster click */
      document.querySelectorAll(".cluster").forEach((cl) => {
        cl.addEventListener("click", () => openCol(cl.dataset.key));
      });

      /* ─── Carousel build ──────────────────────────────────────── */
      function buildCarousel(photos) {
        cTrack.innerHTML = "";
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const W = Math.min(vw - 88, 310);
        const H = Math.min(Math.floor(vh * 0.5), 490);

        photos.forEach((src, i) => {
          const card = document.createElement("div");
          card.className = "photo-card";
          card.style.cssText = `width:${W}px;height:${H}px`;
          card.innerHTML = `<img src="${src}" alt="" draggable="false" loading="lazy"/>`;
          cTrack.appendChild(card);
        });
      }

      /* ─── Carousel position ───────────────────────────────────── */
      function positionCarousel(animated = true) {
        const cards = [...cTrack.querySelectorAll(".photo-card")];
        if (!cards.length) return;

        const ow = cOuter.offsetWidth;
        const cw = cards[0].offsetWidth;
        const gap = 14;
        const step = cw + gap;
        const off = ow / 2 - cw / 2 - idx * step;

        cTrack.style.transition = animated
          ? "transform .44s cubic-bezier(.22,1,.36,1)"
          : "none";
        cTrack.style.transform = `translateX(${off}px)`;

        cards.forEach((c, i) => c.classList.toggle("side", i !== idx));
        refreshScrubber();
      }

      /* ─── Scrubber ────────────────────────────────────────────── */
      function buildScrubber(total) {
        scrubEl.innerHTML = "";
        const n = Math.min(total, 52);
        for (let i = 0; i < n; i++) {
          const t = document.createElement("div");
          t.className = "s-tick" + (i === 0 ? " on" : "");
          scrubEl.appendChild(t);
        }
      }
      function refreshScrubber() {
        if (!key) return;
        const ticks = scrubEl.querySelectorAll(".s-tick");
        const total = COLS[key].photos.length;
        const r = idx / Math.max(total - 1, 1);
        const ai = Math.round(r * (ticks.length - 1));
        ticks.forEach((t, i) => t.classList.toggle("on", i === ai));
      }
      scrubEl.addEventListener("click", (e) => {
        if (!key) return;
        const r = Math.max(0, Math.min(1, e.offsetX / scrubEl.offsetWidth));
        idx = Math.round(r * (COLS[key].photos.length - 1));
        positionCarousel();
      });

      /* ─── Drag / swipe carousel ───────────────────────────────── */
      function dragStart(x) {
        drag.on = true;
        drag.x0 = x;
        drag.xc = x;
      }
      function dragMove(x) {
        if (drag.on) drag.xc = x;
      }
      function dragEnd() {
        if (!drag.on) return;
        drag.on = false;
        if (!key) return;
        const d = drag.xc - drag.x0;
        const total = COLS[key].photos.length;
        if (Math.abs(d) > 32) {
          if (d < 0 && idx < total - 1) idx++;
          else if (d > 0 && idx > 0) idx--;
        }
        positionCarousel();
      }

      cOuter.addEventListener(
        "touchstart",
        (e) => dragStart(e.touches[0].clientX),
        { passive: true },
      );
      cOuter.addEventListener(
        "touchmove",
        (e) => dragMove(e.touches[0].clientX),
        { passive: true },
      );
      cOuter.addEventListener("touchend", dragEnd);
      cOuter.addEventListener("mousedown", (e) => {
        dragStart(e.clientX);
        e.preventDefault();
      });
      window.addEventListener("mousemove", (e) => dragMove(e.clientX));
      window.addEventListener("mouseup", dragEnd);

      window.addEventListener("keydown", (e) => {
        if (!key) return;
        const t = COLS[key].photos.length;
        if (e.key === "ArrowRight" && idx < t - 1) {
          idx++;
          positionCarousel();
        }
        if (e.key === "ArrowLeft" && idx > 0) {
          idx--;
          positionCarousel();
        }
        if (e.key === "Escape") closeCol();
      });

      /* ─── Like ────────────────────────────────────────────────── */
      likeBtn.addEventListener("click", () => {
        if (!key) return;
        COLS[key].liked = !COLS[key].liked;
        likeBtn.classList.toggle("liked", COLS[key].liked);
        likeBtn.style.transform = "scale(1.42)";
        setTimeout(() => (likeBtn.style.transform = ""), 230);
      });

      /* ─── Zoom ────────────────────────────────────────────────── */
      function applyZoom() {
        gScroll.classList.remove("z-out", "z-in");
        if (zoom === -1) gScroll.classList.add("z-out");
        if (zoom === 1) gScroll.classList.add("z-in");
      }
      function flash(el) {
        el.classList.add("flashed");
        setTimeout(() => el.classList.remove("flashed"), 320);
      }

      document.getElementById("zoomOutBtn").addEventListener("click", () => {
        if (zoom > -1) {
          zoom--;
          applyZoom();
        }
        flash(document.getElementById("zoomOutBtn"));
      });
      document.getElementById("zoomInBtn").addEventListener("click", () => {
        if (zoom < 1) {
          zoom++;
          applyZoom();
        }
        flash(document.getElementById("zoomInBtn"));
      });

      /* Pinch-to-zoom */
      gScroll.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinch0 = Math.hypot(dx, dy);
          }
        },
        { passive: true },
      );

      gScroll.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length !== 2) return;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const r = dist / pinch0;
          if (r > 1.28 && zoom < 1) {
            zoom = 1;
            applyZoom();
            pinch0 = dist;
          }
          if (r < 0.72 && zoom > -1) {
            zoom = -1;
            applyZoom();
            pinch0 = dist;
          }
          if (r > 0.88 && r < 1.12 && zoom !== 0) {
            zoom = 0;
            applyZoom();
          }
        },
        { passive: true },
      );

      /* ─── Search filter ───────────────────────────────────────── */
      srchEl.addEventListener("input", () => {
        const q = srchEl.value.toLowerCase().trim();
        document.querySelectorAll(".c-row").forEach((row) => {
          const nm = (row.dataset.name || "").toLowerCase();
          row.classList.toggle("dim", !!(q && !nm.includes(q)));
        });
      });

      /* ─── Back swipe on detail (touch-from-left) ─────────────── */
      let swipeX0 = 0;
      dView.addEventListener(
        "touchstart",
        (e) => {
          swipeX0 = e.touches[0].clientX;
        },
        { passive: true },
      );
      dView.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - swipeX0;
          if (dx > 72 && swipeX0 < 60) closeCol();
        },
        { passive: true },
      );
    </script>
  </body>
